<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Set Up the School Dance · Rigid Motions</title><style>
:root{--navy:#17324d;--paper:#f7f5ef;--green:#187464;--orange:#d16930;--blue:#cde4f1}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--navy);font-family:Arial,Helvetica,sans-serif}header{background:var(--navy);color:white;padding:17px 4%;display:flex;justify-content:space-between;align-items:center;gap:20px}.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;opacity:.75}h1{font-size:clamp(23px,3vw,36px);margin:0;font-weight:600}button,select,input{font:inherit}button{cursor:pointer;border:1px solid #c4cfce;background:white;border-radius:9px;padding:12px 17px;color:var(--navy);font-weight:600;transition:background .15s}button:hover{background:#e6efed}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--orange);outline-offset:3px}button:disabled{opacity:.45;cursor:default}.utility{background:transparent;color:inherit;border-color:#7a8fa3;font-size:13px}nav{display:flex;gap:8px;padding:20px 4% 0;flex-wrap:wrap}nav button[aria-pressed=true]{background:var(--navy);color:white;border-color:var(--navy)}nav button:last-child{margin-left:auto}main{padding:18px 4% 24px;max-width:1700px;margin:auto}.intro{display:flex;align-items:flex-start;justify-content:space-between;gap:25px;margin-bottom:18px}.intro h2{font-size:27px;margin:0 0 7px}.intro p{margin:0;line-height:1.5;font-size:17px;max-width:850px}.badge{font-size:12px;white-space:nowrap;border:1px solid #b8c7c4;padding:9px 12px;border-radius:20px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px}.scene{border:1px solid #d6d9ce;border-radius:16px;overflow:hidden;background:#fff;position:relative}.scene svg{display:block;width:100%;height:auto;max-height:56vh;min-height:280px;touch-action:none}.legend{display:flex;gap:20px;align-items:center;padding:12px 20px;border-top:1px solid #e4e6de;font-size:13px}.swatch{display:inline-block;width:23px;border-top:3px solid var(--green);margin-right:6px;vertical-align:middle}.dash{border-top:2px dashed #617185}.side{display:flex;flex-direction:column;gap:12px;background:white;border:1px solid #d6d9ce;border-radius:16px;padding:22px}.side h3{margin:0;font-size:18px}.side label{font-size:14px;display:block;margin:0 0 9px}.side input[type=range]{width:100%;accent-color:var(--green)}select{padding:10px;width:100%;border:1px solid #c4cfce;border-radius:7px;color:var(--navy);background:white}fieldset{padding:0;border:0;margin:0}fieldset legend{font-weight:bold;margin-bottom:12px} .setting{margin-bottom:12px}.hint{font-size:13px;color:#566b75;line-height:1.5;margin:8px 0 0}.notation{font-family:Georgia,serif;font-style:italic;font-size:24px;margin:4px 0 18px}.toggle{display:flex!important;gap:10px;align-items:center;margin-bottom:14px!important;line-height:1.3}.toggle input{width:18px;height:18px;accent-color:var(--green)}.check{border-top:1px solid #dce2dc;padding-top:16px;font-size:14px;line-height:1.4}.actions{display:flex;gap:10px;align-items:center;margin-top:17px;flex-wrap:wrap}.primary{background:var(--green);color:white;border-color:var(--green)}.primary:hover{background:#125747}.predict{background:#ece8de;border:0}.status{font-size:15px;line-height:1.4;margin-left:8px;flex:1;min-width:200px}.answers{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.answers button{flex:1}footer{font-size:13px;color:#566b75;margin-top:18px;display:flex;justify-content:space-between;gap:15px}.tiny{padding:0;border:0;background:none;font-size:13px;text-decoration:underline}.hidden{display:none!important}svg text{font-family:Arial,sans-serif;fill:var(--navy)}@media(max-width:850px){.workspace{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr;gap:20px}.scene svg{max-height:none}.intro .badge{display:none}header{padding:20px}main{padding:20px}nav{padding:18px 20px 0}nav button:last-child{margin-left:0}h1{font-size:25px}}@media(max-width:520px){.side{display:block}.side>div{margin-bottom:20px}.intro h2{font-size:23px}.utility{display:none}nav button{font-size:13px;padding:10px}.legend{font-size:11px;gap:10px}.scene svg{min-height:0}footer{display:block}}
</style></head><body>
<header><div><div class="eyebrow">Geometry lab / Day 4</div><h1>Set Up the School Dance</h1></div><button class="utility" id="fullscreen">Full screen ⛶</button></header>
<nav aria-label="Choose a demonstration"><button data-mode="translation" aria-pressed="true">01 · Translation</button><button data-mode="reflection" aria-pressed="false">02 · Reflection</button><button data-mode="rotation" aria-pressed="false">03 · Rotation</button><button id="challenge" aria-pressed="false">Which motion? ↗</button></nav>
<main><div class="intro"><div><h2 id="title"></h2><p id="story"></p></div><span class="badge">PREDICT · WATCH · EXPLAIN</span></div><div class="workspace"><section class="scene" aria-label="Animated geometry scene"><svg id="stage" viewBox="0 0 900 540" role="img" aria-label="Overhead gym showing a rigid motion"></svg><div class="legend"><span><i class="swatch dash"></i>Original position</span><span><i class="swatch"></i>Moving figure / image</span><span id="viewLabel">Overhead view</span></div></section><aside class="side"><div id="motionSettings"></div><div><fieldset><legend>Reveal the geometry</legend><label class="toggle"><input type="checkbox" id="labels" checked>Vertex labels</label><label class="toggle"><input type="checkbox" id="original" checked>Original position</label><label class="toggle"><input type="checkbox" id="guides">Checking guides</label></fieldset><div class="check" id="checkText">Predict first. Then reveal the guides to check the movement.</div></div></aside></div><div class="actions"><button class="predict" id="predict">1 · Predict</button><button class="primary" id="animate">2 · Animate</button><button id="reset">Reset</button><div class="status" id="status" role="status" aria-live="polite">Where will the figure finish?</div></div><div id="answers" class="answers hidden"><button data-answer="translation">Translation · Slide</button><button data-answer="reflection">Reflection · Flip</button><button data-answer="rotation">Rotation · Turn</button><button id="next">Next challenge →</button></div><footer><span>Same size. Same shape. Three different movements.</span><button id="download" class="tiny">Download HTML for offline use</button></footer></main>
<script>
'use strict';
const $=id=>document.getElementById(id), modes=['translation','reflection','rotation'];
const state={mode:'translation',p:0,dx:260,dy:-80,mirrorX:465,tilt:0,angle:90,dir:1,challenge:false,answered:false,running:false,raf:0};
const meta={translation:{title:'Slide the snack table',story:'The table needs to move across the gym. Follow the arrow from D to E without turning it.',question:'Where will each corner land? Will the table turn?',check:'Every vertex moves the same distance and direction as D → E.'},reflection:{title:'Mirror the entrance decorations',story:'Make a matching pennant on the other side of the entrance. The line m is your mirror.',question:'Where will the matching pennant appear? Which way will its vertices go around?',check:'The mirror line perpendicularly bisects each segment joining a point to its image. The vertex order reverses.'},rotation:{title:'Turn the entrance gate',story:'Swing the gate around its fixed hinge P. Choose the size and direction of the turn.',question:'What stays fixed? Where will the far end of the gate finish?',check:'The hinge P stays fixed. Each vertex keeps its distance from P and turns through the same angle.'}};
function pts(){return state.mode==='translation'?[[180,300],[300,325],[205,395]]:state.mode==='reflection'?[[240,170],[320,265],[230,280]]:[[450,265],[650,265],[650,285],[450,285]]}
function reflected([x,y]){let a=(90+state.tilt)*Math.PI/180,ux=Math.cos(a),uy=Math.sin(a),dx=x-state.mirrorX,dy=y-275,d=dx*ux+dy*uy;return[state.mirrorX+2*d*ux-dx,275+2*d*uy-dy]}
function transformed(q,p=state.p){let[x,y]=q;if(state.mode==='translation')return[x+p*state.dx,y+p*state.dy];if(state.mode==='reflection'){let r=reflected(q);return[x+(r[0]-x)*p,y+(r[1]-y)*p]}let a=-state.dir*state.angle*Math.PI/180*p,dx=x-450,dy=y-275;return[450+dx*Math.cos(a)-dy*Math.sin(a),275+dx*Math.sin(a)+dy*Math.cos(a)]}
function line(a,b,extra=''){return `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" ${extra}/>`}function poly(ps,extra){return `<polygon points="${ps.map(p=>p.join(',')).join(' ')}" ${extra}/>`}function text(x,y,s,extra=''){return `<text x="${x}" y="${y}" ${extra}>${s}</text>`}function circle(x,y,r,extra=''){return `<circle cx="${x}" cy="${y}" r="${r}" ${extra}/>`}
function labels(ps,prime=false){let cx=ps.reduce((s,p)=>s+p[0],0)/ps.length,cy=ps.reduce((s,p)=>s+p[1],0)/ps.length;return ps.map(([x,y],i)=>{if(state.mode==='rotation'&&(i===0||i===3))return '';let d=Math.hypot(x-cx,y-cy)||1;return text(x+18*(x-cx)/d,y+18*(y-cy)/d+5,'ABCD'[i]+(prime?'′':''),'font-size="19" font-weight="bold" text-anchor="middle"')}).join('')}
function render(){let ps=pts(),end=ps.map(q=>transformed(q,1)),now=ps.map(q=>transformed(q)),guides=$('guides').checked&&!state.challenge;
let svg=`<defs><pattern id="floor" width="60" height="36" patternUnits="userSpaceOnUse"><rect width="60" height="36" fill="#eee5d4"/><path d="M0 0H60V36" fill="none" stroke="#ddd1ba" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d16930"/></marker></defs><rect width="900" height="540" fill="#edf0e9"/><rect x="35" y="30" width="830" height="480" rx="12" fill="url(#floor)" stroke="#c6c2b2" stroke-width="4"/><g fill="none" stroke="#fffaf0" stroke-width="3" opacity=".65"><rect x="90" y="80" width="720" height="380" rx="5"/><line x1="450" y1="80" x2="450" y2="460"/><circle cx="450" cy="270" r="100"/></g><rect x="352" y="20" width="196" height="40" rx="7" fill="#17324d"/>${text(450,46,'SCHOOL DANCE','text-anchor="middle" style="fill:white" font-size="16" letter-spacing="2"')}<g fill="#17324d" opacity=".2"><rect x="60" y="100" width="14" height="90" rx="3"/><rect x="826" y="350" width="14" height="90" rx="3"/></g>`;
if(state.mode==='translation'&&!state.challenge){let d=[110,160],e=[110+state.dx,160+state.dy];svg+=line(d,e,'stroke="#d16930" stroke-width="4" marker-end="url(#arrow)"')+circle(...d,5,'fill="#17324d"')+text(d[0]-20,d[1]+5,'D','font-size="19" font-weight="bold"')+circle(...e,13,'fill="#fff" stroke="#d16930" stroke-width="3" id="dragHandle" style="cursor:grab"')+text(e[0]+19,e[1]+6,'E','font-size="19" font-weight="bold"');}
if(state.mode==='reflection'){let a=(90+state.tilt)*Math.PI/180,u=[Math.cos(a),Math.sin(a)],o=[state.mirrorX,275];svg+=line([o[0]-210*u[0],o[1]-210*u[1]],[o[0]+210*u[0],o[1]+210*u[1]],'stroke="#d16930" stroke-width="3" stroke-dasharray="10 6"')+text(o[0]-216*u[0]+12,o[1]-216*u[1],'m','font-size="22" font-style="italic"');}
if(guides){ps.forEach((q,i)=>{if(state.mode==='translation')svg+=line(q,end[i],'stroke="#d16930" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"');if(state.mode==='reflection'){let mid=[(q[0]+end[i][0])/2,(q[1]+end[i][1])/2],a=(90+state.tilt)*Math.PI/180,u=[Math.cos(a),Math.sin(a)],v=[-u[1],u[0]],s=9;svg+=line(q,end[i],'stroke="#d16930" stroke-width="2" stroke-dasharray="5 5"')+`<path d="M${mid[0]+s*u[0]},${mid[1]+s*u[1]} l${s*v[0]},${s*v[1]} l${-s*u[0]},${-s*u[1]}" fill="none" stroke="#17324d" stroke-width="1.5"/>`; }if(state.mode==='rotation'&&(i===1||i===2)){svg+=line([450,275],q,'stroke="#d16930" stroke-width="2" stroke-dasharray="5 5"')+line([450,275],now[i],'stroke="#d16930" stroke-width="2" stroke-dasharray="5 5"');}})}
if($('original').checked){svg+=poly(ps,'fill="none" stroke="#617185" stroke-width="2.5" stroke-dasharray="8 6"');if($('labels').checked&&state.p>.08)svg+=labels(ps);}
svg+=poly(now,'fill="#cde4f1" fill-opacity=".9" stroke="#187464" stroke-width="4" stroke-linejoin="round"');
if(state.mode==='translation'){[[218,326],[251,335],[220,362]].forEach((q,i)=>{let a=transformed(q);svg+=circle(...a,i===1?9:7,'fill="#f7f5ef" stroke="#187464" stroke-width="2"')});}
if(state.mode==='rotation'){for(let i=1;i<8;i++){let a=transformed([450+i*25,265]),b=transformed([450+i*25,285]);svg+=line(a,b,'stroke="#187464" stroke-width="3"')}svg+=circle(450,275,7,'fill="#17324d" stroke="white" stroke-width="2"')+text(430,308,'P','font-size="20" font-weight="bold"');}
if($('labels').checked)svg+=labels(now,state.p>.01);svg+=text(65,490,state.challenge?'Watch carefully. What movement do you notice?':state.mode==='translation'?'Drag E to change the move.':state.mode==='reflection'?'One pennant. A matching mirror image.':'A fixed hinge. A moving gate.','font-size="16"');$('stage').innerHTML=svg;}
function settings(){const m=state.mode;if(state.challenge){$('motionSettings').innerHTML='<h3>Mystery motion</h3><p class="hint">Watch the movement, then choose its name below.</p>';$('guides').disabled=true;return}$('guides').disabled=false;let html='<h3>Set the movement</h3>';
if(m==='translation')html+='<div class="notation">T<sub>DE</sub>(△ABC)</div><div class="setting"><label for="dx">Move right <output id="dxOut">'+state.dx+'</output></label><input id="dx" type="range" min="80" max="360" step="10" value="'+state.dx+'"></div><div class="setting"><label for="dy">Move up <output id="dyOut">'+(-state.dy)+'</output></label><input id="dy" type="range" min="0" max="100" step="10" value="'+(-state.dy)+'"></div><p class="hint">Distances use the same scene units. You can also drag E.</p>';
if(m==='reflection')html+='<div class="notation">R<sub>m</sub>(△ABC)</div><div class="setting"><label for="tilt">Tilt the mirror line <output id="tiltOut">'+state.tilt+'°</output></label><input id="tilt" type="range" min="-20" max="20" value="'+state.tilt+'"></div><div class="setting"><label for="mirrorX">Move the mirror line</label><input id="mirrorX" type="range" min="420" max="490" value="'+state.mirrorX+'"></div><p class="hint">A mirror image reverses vertex order. The flip animation represents turning the paper over.</p>';
if(m==='rotation')html+='<div class="notation" id="rotNotation">'+rotationNotation()+'</div><div class="setting"><label for="angle">Angle of turn</label><select id="angle"><option value="60">60°</option><option value="90">90°</option><option value="180">180°</option></select></div><div class="setting"><label for="dir">Direction</label><select id="dir"><option value="1">Counterclockwise ↶</option><option value="-1">Clockwise ↷</option></select></div><p class="hint">P is the hinge. Positive angles turn counterclockwise; negative angles turn clockwise.</p>';
$('motionSettings').innerHTML=html;if(m==='rotation'){$('angle').value=state.angle;$('dir').value=state.dir;}
['dx','dy','tilt','mirrorX','angle','dir'].forEach(id=>{if($(id))$(id).oninput=e=>{stop();state.p=0;state[id]=Number(e.target.value)*(id==='dy'?-1:1);if($(id+'Out'))$(id+'Out').textContent=e.target.value+(id==='tilt'?'°':'');if($('rotNotation'))$('rotNotation').innerHTML=rotationNotation();$('status').textContent='Movement updated. Make a new prediction.';render();}})}
function rotationNotation(){return 'R<sub>P, '+(state.dir===-1?'−':'')+state.angle+'°</sub>(gate)'}
function stop(){cancelAnimationFrame(state.raf);state.running=false;$('animate').textContent='2 · Animate';}
function reset(){stop();state.p=0;state.answered=false;$('status').textContent=state.challenge?'Watch, then choose the motion.':'Where will the figure finish?';document.querySelectorAll('[data-answer]').forEach(b=>b.disabled=false);render();}
function choose(m,challenge=false){stop();state.mode=m;state.challenge=challenge;state.p=0;state.answered=false;$('title').textContent=challenge?'Which motion do you see?':meta[m].title;$('story').textContent=challenge?'Watch the setup crew. Is this a slide, a flip, or a turn?':meta[m].story;$('answers').classList.toggle('hidden',!challenge);document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',!challenge&&b.dataset.mode===m));$('challenge').setAttribute('aria-pressed',challenge);settings();check();reset();}
function check(){$('checkText').textContent=state.challenge?'Choose a motion and explain your evidence.':$('guides').checked?meta[state.mode].check:'Predict first. Then reveal the guides to check the movement.';}
function animate(){if(state.running){stop();return}if(state.p>=1)state.p=0;let from=state.p,start=performance.now(),duration=2600*(1-from);state.running=true;$('animate').textContent='Pause';$('status').textContent='Watch what moves and what stays fixed.';function frame(t){let x=Math.min(1,(t-start)/duration);state.p=from+(1-from)*(x*x*(3-2*x));render();if(x<1)state.raf=requestAnimationFrame(frame);else{stop();$('status').textContent=state.challenge?'Which motion was it? Choose below.':'What evidence shows this is a '+state.mode+'?';}}state.raf=requestAnimationFrame(frame);}
function next(){let choices=modes.filter(m=>m!==state.mode),m=choices[Math.floor(Math.random()*choices.length)];state.dx=210+Math.floor(Math.random()*4)*30;state.dy=-60;state.tilt=0;state.mirrorX=465;state.angle=[60,90,180][Math.floor(Math.random()*3)];state.dir=Math.random()<.5?1:-1;choose(m,true);}
$('animate').onclick=animate;$('reset').onclick=reset;$('predict').onclick=()=>{$('status').textContent=state.challenge?'Predict the final position. Then watch and name the motion.':meta[state.mode].question;};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>choose(b.dataset.mode));$('challenge').onclick=next;$('next').onclick=next;['labels','original','guides'].forEach(id=>$(id).onchange=()=>{check();render()});document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(state.p<.99){$('status').textContent='Play the complete movement first.';return}if(b.dataset.answer===state.mode){state.answered=true;$('status').textContent='Correct! '+meta[state.mode].check;document.querySelectorAll('[data-answer]').forEach(q=>q.disabled=true);}else{$('status').textContent='Try again. Look for a slide, a mirror flip, or a turn around a fixed point.';}});
let dragging=false;function drag(e){let p=$('stage').createSVGPoint();p.x=e.clientX;p.y=e.clientY;p=p.matrixTransform($('stage').getScreenCTM().inverse());state.dx=Math.round(Math.max(80,Math.min(360,p.x-110)));state.dy=Math.round(Math.max(-100,Math.min(0,p.y-160)));$('dx').value=state.dx;$('dy').value=-state.dy;$('dxOut').textContent=state.dx;$('dyOut').textContent=-state.dy;render();}
$('stage').addEventListener('pointerdown',e=>{if(e.target.id==='dragHandle'){stop();state.p=0;dragging=true;$('stage').setPointerCapture(e.pointerId);drag(e);}});$('stage').addEventListener('pointermove',e=>{if(dragging)drag(e)});$('stage').addEventListener('pointerup',()=>dragging=false);$('stage').addEventListener('pointercancel',()=>dragging=false);
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{$('status').textContent='Use your browser’s full-screen command for a larger view.'}};document.addEventListener('fullscreenchange',()=>$('fullscreen').textContent=document.fullscreenElement?'Exit full screen':'Full screen ⛶');
$('download').onclick=()=>{const blob=new Blob(['<!DOCTYPE html>\n'+document.documentElement.outerHTML],{type:'text/html'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='School_Dance_Transformations.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
choose('translation');
</script><script>

/* SCORM 1.2 connection: an ungraded, browsable activity. */
(function () {
  'use strict';
  var api = null, active = false, started = 0;
  function findAPI(win) {
    for (var n = 0; win && n < 50; n++) {
      try {
        if (win.API && typeof win.API.LMSInitialize === 'function') return win.API;
        if (!win.parent || win.parent === win) break;
        win = win.parent;
      } catch (e) { break; }
    }
    return null;
  }
  function connect() {
    if (active) return;
    api = findAPI(window);
    if (!api) { try { api = findAPI(window.opener); } catch (e) {} }
    if (!api) return; // Standalone HTML remains fully usable.
    try {
      if (String(api.LMSInitialize('')) !== 'true') return;
      active = true; started = Date.now();
      var status = api.LMSGetValue('cmi.core.lesson_status');
      if (!status || status === 'not attempted') api.LMSSetValue('cmi.core.lesson_status', 'browsed');
      api.LMSCommit('');
    } catch (e) { /* LMS errors must not interrupt the demonstration. */ }
  }
  function finish() {
    if (!active || !api) return;
    active = false;
    var total = Math.max(0, Math.floor((Date.now() - started) / 10));
    var h = Math.min(9999, Math.floor(total / 360000));
    var m = Math.floor(total / 6000) % 60, s = Math.floor(total / 100) % 60;
    function two(n) { return String(n).padStart(2, '0'); }
    try {
      api.LMSSetValue('cmi.core.session_time', two(h) + ':' + two(m) + ':' + two(s) + '.' + two(total % 100));
      api.LMSSetValue('cmi.core.exit', '');
      api.LMSCommit('');
    } catch (e) {}
    try { api.LMSFinish(''); } catch (e) {}
  }
  window.addEventListener('pagehide', finish);
  window.addEventListener('unload', finish);
  window.addEventListener('pageshow', function (e) { if (e.persisted) connect(); });
  connect();
})();

</script></body></html>
